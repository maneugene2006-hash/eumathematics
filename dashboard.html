<!DOCTYPE html>
<html lang="rw">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dashboard - Learn Math</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}

body{
    display:flex;
    height:100vh;
}

/* Sidebar */
.sidebar{
    width:220px;
    background:linear-gradient(135deg,#007BFF,#c300ff);
    color:white;
    padding:20px;
}

.sidebar h2{
    margin-bottom:20px;
    text-align:center;
}

.sidebar ul{
    list-style:none;
}

.sidebar ul li{
    margin-bottom:10px;
}

.sidebar ul li a{
    display:block;
    padding:12px;
    background:rgba(255,255,255,0.2);
    border-radius:6px;
    color:white;
    text-decoration:none;
    transition:0.3s;
}

.sidebar ul li a:hover{
    background:#0056b3;
}

/* Main */
.main{
    flex:1;
    padding:40px;
    background:#852e2e;
    display:flex;
    justify-content:center;
    align-items:center;
}

.card{
    width:400px;
    background:white;
    padding:30px;
    border-radius:12px;
    box-shadow:0 0 15px rgba(0,0,0,0.4);
    text-align:center;
}

.card h2{
    margin-bottom:20px;
    color:#333;
}

select{
    width:100%;
    padding:12px;
    border-radius:6px;
    border:1px solid gray;
    font-size:16px;
}

button{
    width:100%;
    padding:12px;
    margin-top:20px;
    background:#007BFF;
    color:white;
    border:none;
    border-radius:6px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#0056b3;
}
</style>
</head>

<body>

<script>
// Kurinda Dashboard
let loggedIn = localStorage.getItem("loggedIn");

if(loggedIn !== "true"){
    alert("Please login first");
    window.location.href="login.html";
}
</script>

<div class="sidebar">

<h2>Learn Math</h2>

<ul>
<li><a href="dashboard.html">🏠 Dashboard</a></li>

<!-- HANO NIHO HAHINDUTSE -->
<li><a href="javascript:history.back()">⬅ Back</a></li>

<li><a href="quiz.html">📝 Quiz</a></li>

<li><a href="index.html">👤 Profile</a></li>

<li><a href="#" onclick="changeProfile()">🔄 Change Profile</a></li>

<li><a href="logout.html">🚪 Logout</a></li>
</ul>

</div>

<div class="main">

<div class="card">

<h2>Choose Level You Have Completed</h2>

<select id="level">
<option value="">Select Level</option>
<option value="Primary">Primary</option>
<option value="O-Level">O'Level</option>
<option value="A-Level">A'Level</option>
<option value="University">University</option>
</select>

<button onclick="continuePage()">Continue</button>

</div>

</div>

<script>
function continuePage(){

let level = document.getElementById("level").value;

if(level===""){
    alert("Please choose your level first");
    return;
}

localStorage.setItem("level",level);
window.location.href="subject.html";
}

function changeProfile(){
localStorage.removeItem("loggedIn");
window.location.href="index.html";
}
</script>

</body>
</html>
